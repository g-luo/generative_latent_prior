# python3 glp_save.py config=save_llama1b_dynamic.yaml
save_root: .
model_name: meta-llama/Llama-3.2-1B
run_name: save_glp-llama1b_dynamic-1B
output_path: ${save_root}/data/llama1b-fineweb-1B
# wandb
wandb_enabled: True
wandb_project: glp
wandb_run_name: ${run_name}
# data
dataset_path: HuggingFaceFW/fineweb
dataset_name: sample-10BT
dataset_split: train
val_size: 10000
seed: 42
# nnsight
latent_model_config:
  hook_kwargs:
    input:
      embed_layer: model.embed_tokens
      # list layers 0-15 if doing multi-layer training
      layers:
        - model.layers.7
  hook_mode: output
# vllm
vllm_kwargs:
  gpu_memory_utilization: 0.5
# saving
batch_size: 10 # batch size for A100 80GB
max_length: 2048 # max sequence length before truncation
acts_per_shard: 1000000 # acts to store per shard
max_total_acts: 5000000 # total acts to store before flushing
